# Read-only overlay via PI_CONFIG_FILES (modules/headless/ai.nix); wins over
# ~/.omp/agent/config.yml, which is untracked and where omp writes. Keys you
# toggle from the UI must live there, not here, or the toggle is shadowed.
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5-5
  advisor: anthropic/claude-sonnet-5:medium
  task: anthropic/claude-sonnet-5:high
  slow: anthropic/claude-fable-5-1:medium
  smol: anthropic/claude-sonnet-5:low
theme:
  dark: dark-gruvbox
symbolPreset: nerd
omitThinking: false
advisor:
  enabled: false
  syncBacklog: "off"
  immuneTurns: 10
lsp:
  enabled: false
defaultThinkingLevel: medium
statusLine:
  compactThinkingLevel: true
startup:
  checkUpdate: true
composer:
  shape: claude
display:
  showTokenUsage: true
  cacheMissMarker: true
disabledProviders:
  - claude-plugins