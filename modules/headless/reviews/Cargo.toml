[package]
name = "reviews"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.30"
# chafa-dyn would link libchafa; halfblocks, sixel and kitty need nothing.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
