[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
launcher-core = { path = "crates/core" }
launcher-clipboard = { path = "crates/clipboard" }
launcher-desktop = { path = "crates/desktop" }
launcher-browser = { path = "crates/browser" }
launcher-passwords = { path = "crates/passwords" }
launcher-dev = { path = "crates/dev" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
